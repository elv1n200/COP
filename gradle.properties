org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
# Loom 1.16 + IntelliJ aren't yet config-cache compatible (FabricMC/fabric-loom#1349).
org.gradle.configuration-cache=false

# --- mc26 branch only -------------------------------------------------------
# Minecraft 26.x ships *unobfuscated* (readable names in the jar) and is Java-25
# bytecode. Loom 1.16.2's plugin metadata targets Java 21, so the Gradle daemon
# must stay on Java 21 (don't set org.gradle.java.home=JDK25 — strict variant
# matching would reject the loom plugin). JDK 25 is supplied purely via the
# Gradle Java toolchain in build.gradle.kts, which loom 1.16 uses for the MC
# decompile + our compile. Kotlin must be 2.3.x (2.2.x maxes at JVM target 24),
# loom must be 1.16+ for the non-obf path, and there is no `mappings(...)`
# declaration (none exist / none needed for unobfuscated MC).
# `main` keeps Kotlin 2.2.21 / Java 21 / loom 1.14 — divergence is intentional.

kotlin.code.style=official
kotlin_version=2.3.10
minecraft_lwjgl_version=3.3.3

minecraft_version=1.21.10
loader_version=0.18.2
loom_version=1.16.2

fabric_kotlin_version=1.13.7+kotlin.2.2.21
fabric_api_version=0.138.4+1.21.10

mod_name=COP
mod_id=cop

mod_version=1.3.3
archives_base_name=cop

# Gradle daemon JDK — mc26 needs JDK 25. Per-developer setting; put it in
# your ~/.gradle/gradle.properties (NOT here) pointing at your JDK 25 install,
# e.g.
#   org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-25.0.2.10-hotspot
# CI uses actions/setup-java which exports JAVA_HOME — Gradle picks it up
# automatically when no override is set, so the workflow needs nothing extra.
