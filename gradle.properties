org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
# Loom 1.16 + IntelliJ aren't yet config-cache compatible (FabricMC/fabric-loom#1349).
org.gradle.configuration-cache=false

# --- Minecraft 26.x toolchain -----------------------------------------------
# COP targets Minecraft 26.x only — Hypixel SkyBlock no longer runs on 1.21.x.
# The final 1.21 build is tagged `1.7.2` and frozen on the `legacy-1.21` branch;
# see BRANCHING.md for the branch layout.
#
# Minecraft 26.x ships *unobfuscated* (readable names in the jar) and is Java-25
# bytecode. Loom 1.16.2 requires at least Java 21 and also runs on JDK 25; using
# JDK 25 for the Gradle daemon matches CI and supplies the compile/decompile
# toolchain directly. A Java-21 daemon also works when Gradle can discover an
# installed JDK-25 toolchain. Kotlin must be 2.3.x (2.2.x maxes at JVM target
# 24), loom must be 1.16+ for the non-obf path, and there is no `mappings(...)`
# declaration (none exist / none needed for unobfuscated MC).

kotlin.code.style=official
kotlin_version=2.3.10
minecraft_lwjgl_version=3.4.1

minecraft_version=26.1.2
loader_version=0.19.2
loom_version=1.16.2

fabric_kotlin_version=1.13.9+kotlin.2.3.10
fabric_api_version=0.149.0+26.1.2

mod_name=COP
mod_id=cop

# Pre-release until the client-test checklist has been completed in-game.
mod_version=1.8.0-beta.4
archives_base_name=cop

# Gradle daemon JDK — 26.x needs JDK 25. Per-developer setting; put it in
# your ~/.gradle/gradle.properties (NOT here) pointing at your JDK 25 install,
# e.g.
#   org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-25.0.2.10-hotspot
# CI uses actions/setup-java which exports JAVA_HOME — Gradle picks it up
# automatically when no override is set, so the workflow needs nothing extra.
