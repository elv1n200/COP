name: Bug Report
description: Reproduzierbarer Fehler in COP auf Minecraft 26.1.2.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Danke für den Report. Bitte teste mit dem aktuellen `mc26`-Build und lies zuerst [SUPPORT.md](https://github.com/elv1n200/COP/blob/mc26/SUPPORT.md).

        **Keine Tokens, privaten Chatnachrichten oder ungeprüften kompletten Konfigurationsdateien posten.** Sicherheitslücken gehören in eine [private Meldung](https://github.com/elv1n200/COP/blob/mc26/SECURITY.md), nicht hierher.

  - type: input
    id: cop-version
    attributes:
      label: COP-Version / Commit
      description: Steht im JAR-Dateinamen; bei einem lokalen Build zusätzlich den Commit angeben.
      placeholder: "1.8.0-beta.5 / abc1234"
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Minecraft, Java, Fabric Loader, Fabric API und Fabric Language Kotlin.
      placeholder: "MC 26.1.2; Java 25; Loader 0.19.2; API 0.149.0+26.1.2; FLK 1.13.9+kotlin.2.3.10"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Betroffener Bereich
      options:
        - Start / Mixin / Kompatibilität
        - ClickGUI / HUD / Eingabe
        - Chat / Commands
        - Dungeon / Solver / Overlay
        - Auto Croesus / Preise
        - Render / Player
        - Mining
        - Spotify / Updater / Netzwerk
        - Konfiguration / Recovery
        - Build / Dokumentation
        - Unklar / mehrere Bereiche
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: Erwartetes und tatsächliches Verhalten
      description: Was sollte passieren, und was ist stattdessen passiert?
      placeholder: |
        Erwartet:
        Tatsächlich:
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduktionsschritte
      description: Kurz, nummeriert und ab einem frischen Client-/Weltzustand.
      placeholder: |
        1. Client starten und …
        2. Modul … aktivieren
        3. …
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: COP Diagnostics
      description: Ausgabe von `/cop diagnostics` einfügen und vorher prüfen. Bei einem Start-Crash stattdessen „nicht verfügbar“ plus Grund angeben.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevanter Log- oder Crash-Ausschnitt
      description: Den kleinsten hilfreichen Ausschnitt aus `latest.log` oder dem Crash Report einfügen; private Pfade/Daten entfernen.
      render: shell

  - type: textarea
    id: isolation
    attributes:
      label: Mod-Konflikt und Zusatzinfos
      description: Bleibt der Fehler in einer separaten Instanz nur mit COP und Pflichtabhängigkeiten? Welche Einstellung ist relevant?
      placeholder: "Minimal getestet: ja/nein; weitere Beobachtungen: …"

  - type: checkboxes
    id: confirmations
    attributes:
      label: Vor dem Absenden
      options:
        - label: Ich nutze Minecraft 26.1.2 und eine JAR mit `+mc26.1.2` im Namen.
          required: true
        - label: Ich habe nach bestehenden Issues gesucht.
          required: true
        - label: Ich habe Diagnose und Logs auf private Daten oder Geheimnisse geprüft.
          required: true
        - label: Ich habe klar markiert, welche Client-Tests ich nicht durchführen konnte.
          required: true
