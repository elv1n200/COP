name: Feature Request
description: Vorschlag für eine neue Funktion oder eine gezielte Verbesserung.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Beschreibe zuerst Problem und Nutzen. Eine Feature-Anfrage ist noch keine Zusage zur Umsetzung.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: Welcher konkrete Ablauf ist heute umständlich oder nicht möglich?
      placeholder: "Wenn ich …, muss ich aktuell …"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Gewünschtes Verhalten
      description: Wie sollte die Funktion aus Nutzersicht reagieren? Nenne UI, Defaults und Abbruchbedingungen.
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Bereich
      options:
        - Dungeon / Solver / Overlay
        - Auto Croesus / Preise
        - ClickGUI / HUD
        - Chat / Commands
        - Render / Player
        - Mining
        - Integration / Netzwerk
        - Addon-API
        - Build / Dokumentation
        - Andere / unklar
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Risiken und Serverregeln
      description: Kann die Idee Eingaben automatisieren, Netzwerkdaten senden, Dateien verändern oder Serverregeln berühren? Wie lässt sie sich sicher begrenzen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativen
      description: Welche vorhandene COP-Funktion, andere Lösung oder kleinere Variante hast du geprüft?

  - type: checkboxes
    id: confirmations
    attributes:
      label: Bestätigung
      options:
        - label: Der Vorschlag zielt auf den aktiven mc26-/Minecraft-26.1.2-Stand.
          required: true
        - label: Ich habe in bestehenden Issues nach ähnlichen Vorschlägen gesucht.
          required: true
