name: Build

# Runs on every push to an active branch + every PR targeting it. Builds the
# jar(s) and uploads them as artifacts so PR reviewers can grab a one-off binary
# without checking out locally.
#
# COP targets Minecraft 26.x only, which is Java-25 bytecode — so every build
# uses JDK 25. The frozen `legacy-1.21` branch is not built here.
on:
  push:
    branches: [main, mc26]
  pull_request:
    branches: [main, mc26]

# Cancel in-progress runs for the same ref when a newer commit lands —
# saves runner minutes when pushing multiple commits in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ github.head_ref || github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cop-jars-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          path: |
            versions/*/build/libs/cop-*.jar
            !versions/*/build/libs/cop-*-sources.jar
          if-no-files-found: error
          retention-days: 14
